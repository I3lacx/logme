<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>LogMe – Sign-in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Sign-in</h1>
  <p id="msg">Reading the sign-in result…</p>
  <p><button id="copy" hidden>Copy address</button></p>
  <p class="muted">Paste the copied address into the terminal where <code>google_health.py auth</code> is waiting.
  This page only displays the address; it sends nothing anywhere.</p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const msg = document.getElementById('msg');
  const btn = document.getElementById('copy');
  if (q.get('code')) {
    msg.textContent = 'Access granted. Copy this page\'s address and paste it into the terminal.';
    btn.hidden = false;
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(location.href); btn.textContent = 'Copied'; }
      catch { btn.textContent = 'Copy failed – copy the address bar manually'; }
    };
  } else if (q.get('error')) {
    msg.textContent = 'Sign-in was not completed: ' + q.get('error');
  } else {
    msg.textContent = 'No sign-in result on this page.';
  }
</script>
</body>
</html>
